<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floresta 28 - Visual Guides</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .visual-section { margin-bottom: 2rem; }
    .visual-section h2 { text-align: center; margin-bottom: 1rem; }
    .image-scroll { display: flex; flex-direction: column; gap: 1rem; }
    .image-scroll img { width: 100%; height: auto; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <header>
    <h1>Floresta 28</h1>
    <p>Visual Site Guides — Scroll to check</p>
  </header>

  <nav>
    <a href="#foundation">Foundation</a>
    <a href="#sewer">Sewer</a>
    <a href="#documents">Documents</a>
  </nav>

  <main>
    <section id="foundation" class="visual-section">
      <h2>Foundation Work — Visual Checklist</h2>
      <div class="image-scroll">
        <img src="images/foundation-1.jpg" alt="Site marking">
        <img src="images/foundation-2.jpg" alt="Excavation">
        <img src="images/foundation-3.jpg" alt="PCC">
        <img src="images/foundation-4.jpg" alt="Reinforcement">
        <img src="images/foundation-5.jpg" alt="Formwork">
        <img src="images/foundation-6.jpg" alt="Concreting">
        <img src="images/foundation-7.jpg" alt="Curing">
        <img src="images/foundation-8.jpg" alt="Red flags">
        <img src="images/foundation-9.jpg" alt="Anti-termite">
      </div>
    </section>

    <section id="sewer" class="visual-section">
      <h2>Sewer & Drainage — Visual Checklist</h2>
      <div class="image-scroll">
        <img src="images/sewer-1.jpg" alt="Floor trap">
        <img src="images/sewer-2.jpg" alt="Vent pipe">
        <img src="images/sewer-3.jpg" alt="Slope">
        <img src="images/sewer-4.jpg" alt="House trap">
        <img src="images/sewer-5.jpg" alt="Rainwater">
        <img src="images/sewer-6.jpg" alt="Red flags">
        <img src="images/sewer-7.jpg" alt="Joints and testing">
      </div>
    </section>

    <section id="documents">
      <h2>Architect Documents</h2>
      <a class="add-btn" href="https://github.com/manikblr/floresta-28/upload/main/docs" target="_blank">+ Add Document</a>
      <div class="doc-grid">
        <a class="doc-card" href="https://github.com/manikblr/floresta-28/blob/main/docs/Plumbing%20BOQ.xlsx" target="_blank">
          <div class="doc-icon">XLS</div>
          <div>
            <div class="doc-name">Plumbing BOQ.xlsx</div>
            <div class="doc-meta">Excel</div>
          </div>
        </a>
        <a class="doc-card" href="https://github.com/manikblr/floresta-28/blob/main/docs/Electrical%20BOQ.xls" target="_blank">
          <div class="doc-icon">XLS</div>
          <div>
            <div class="doc-name">Electrical BOQ.xls</div>
            <div class="doc-meta">Excel</div>
          </div>
        </a>
      </div>
    </section>
  </main>

  <footer>
    <p>Floresta 28 · Visual guides · Oct 2026</p>
  </footer>
</body>
</html>
